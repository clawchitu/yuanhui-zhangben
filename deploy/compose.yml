# 生产 Compose（§9.1）：caddy、api、postgres，外加只在发布时用的 migrate。
# 网络拆成两个（Codex 7）：
#   edge（172.30.0.0/24）：caddy、api。只有 caddy 映射端口到公网（80、443/tcp）；api 不映射任何端口；
#     api 要连 OSS、快鸟，出网走这个网络。
#   db（172.30.1.0/24，internal: true）：api、postgres、migrate。不出网，caddy 不在上面、连不到数据库。
# 固定地址：caddy 172.30.0.2（api 只信这个地址给的 X-Forwarded-For，TRUSTED_PROXY）、api 172.30.0.3；
# 动态分配限制在 ip_range（.128/25）里，和固定地址错开（§14 S10a-1）。
# 镜像不从 Docker Hub 拉（ECS 拉不动）：GitHub Actions 打成 tar、deploy.sh 传上去 docker load（IMAGES_TAR），或从 ACR 拉；
# 三个镜像变量都必填，不给 Docker Hub 默认值（Fable 必须改 4）。
# 不开 443/udp（HTTP/3，§14 S10a-5）。
name: yuanhui

x-logging: &logging
  # json-file 默认不限大小，Caddy 访问日志和 api 日志会写满系统盘（Fable 必须改 5）
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
  db:
    internal: true
    ipam:
      config:
        - subnet: 172.30.1.0/24
          ip_range: 172.30.1.128/25

x-api-env: &api-env
  # 口令原样拼进连接串，所以只许字母数字（openssl rand -hex 24 生成），remote-deploy.sh 发布前检查（Codex 8、Fable 必须改 9）
  DATABASE_URL: postgres://yuanhui:${POSTGRES_PASSWORD:?}@postgres:5432/yuanhui

services:
  caddy:
    image: ${CADDY_IMAGE:?填 ACR 上的 caddy:2.10.2，见 deploy/.env.example}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?}
      PUBLIC_IP: ${PUBLIC_IP:?}
    volumes:
      # 挂目录不挂单个文件：换文件（新 inode）后容器里也看得到，deploy 再 caddy reload
      - ./caddy:/etc/caddy:ro
      - /data/caddy/data:/data
      - /data/caddy/config:/config
    networks:
      edge: { ipv4_address: 172.30.0.2 }
    depends_on: [api]
  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    # 上限是真的 512 MB：不许再用 swap 顶（§14 S10a-7）
    mem_limit: 512m
    memswap_limit: 512m
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    # 不设 UV_THREADPOOL_SIZE（§14 T2-3）
    environment:
      <<: *api-env
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: "1"
      TRUSTED_PROXY: 172.30.0.2
      IMAGE_CACHE_DIR: /data/img
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIN_BUILD: ${MIN_BUILD:-0}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-0}
      # S21 服务器地址下发：空 = 不下发；不在白名单（§9.2）api 拒绝启动
      API_BASE: ${API_BASE:-}
      # 恢复模式（§4.6）：平时 0。整机恢复后临时开 1，让重新开通的设备补交保留的 op，补完改回 0（runbook「恢复模式」）
      RECOVERY_MODE: ${RECOVERY_MODE:-0}
      PRODUCT_IMAGES_ENABLED: ${PRODUCT_IMAGES_ENABLED:-0}
      KUAINIAO_APPCODE: ${KUAINIAO_APPCODE:-}
      OBJECT_STORE: ${OBJECT_STORE:-none}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ARCHIVE_BUCKET: ${OSS_ARCHIVE_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      # 监控与告警（S10c，§9.5）：检查任务每分钟跑一次，告警写 /data/monitor/outbox.jsonl，本机探测（deploy/probe/）ssh 拉回去发给 Chitu。
      # 备份目录只读挂进来看 metrics.prom、gate-skips.log、restore-events.log；磁盘用量看 /data 所在的盘。
      MONITOR_DIR: /data/monitor
      MONITOR_BACKUP_DIR: /backup
      MONITOR_DISK_PATH: /data/monitor
      # 可选：再直接推一份（https）。留空 = 只走 outbox
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
      # 「营业时间没有同步」只监控这些店（逗号分隔 store_id）；留空 = 都不监控
      NO_SYNC_ALERT_STORES: ${NO_SYNC_ALERT_STORES:-}
    volumes:
      # 宿主目录由 bootstrap-ecs.sh 建好并 chown 1000:1000（镜像里 node 用户）
      - /data/img:/data/img
      - /data/monitor:/data/monitor
      # backup.sh 把 backup/ 设成 711、要读的几个文件 644：node 用户能按名字读、列不了目录（work.* 里的明文 dump 是 700）
      - ./backup:/backup:ro
    networks:
      edge: { ipv4_address: 172.30.0.3 }
      db: {}
    depends_on:
      postgres: { condition: service_healthy }
  # 只在发布时由 remote-deploy.sh 跑：docker compose run --rm migrate。不在 edge 上、没有固定地址（Codex 2）
  migrate:
    profiles: [tools]
    image: ${API_IMAGE:?}
    command: ["node", "scripts/migrate.ts"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment: *api-env
    networks: [db]
    depends_on:
      postgres: { condition: service_healthy }
  # 备份 / 恢复命令（S10b）：只由 backup.sh 用 docker compose run 起，跑完即删。用当前 api 镜像里的 scripts/backup.ts。
  # 凭据是备份专用的 RAM 账号（§14 T21），和 api 的 OSS 账号分开；api 容器拿不到这些变量，也拿不到 BACKUP_PASSPHRASE。
  # 要连库（db）也要出网传 OSS（edge，动态地址，不占 caddy / api 的固定地址）。
  backup:
    profiles: [tools]
    image: ${API_IMAGE:?}
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    # 上限是真的 256 MB（§14 S10a-7、S10b-8）
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      <<: *api-env
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_OSS_REGION: ${OSS_REGION:-}
      BACKUP_OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      # 备份桶开了合规保留（WORM，35 天），只放 backups/；心跳和 deletions/ 在存档桶（S10 部署实测，负责人 11/22 决定）。
      # BACKUP_BUCKET 没填时退回老布局（全部在存档桶）
      BACKUP_OSS_BUCKET: ${BACKUP_BUCKET:-${OSS_ARCHIVE_BUCKET:-}}
      BACKUP_OSS_ARCHIVE_BUCKET: ${OSS_ARCHIVE_BUCKET:-}
      BACKUP_OSS_ACCESS_KEY_ID: ${BACKUP_OSS_ACCESS_KEY_ID:-}
      BACKUP_OSS_ACCESS_KEY_SECRET: ${BACKUP_OSS_ACCESS_KEY_SECRET:-}
    networks: [db, edge]
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: ${POSTGRES_IMAGE:?填 ACR 上的 postgres:16，见 deploy/.env.example}
    restart: unless-stopped
    logging: *logging
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "password_encryption=scram-sha-256"]
    environment:
      POSTGRES_USER: yuanhui
      POSTGRES_DB: yuanhui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - /data/pg:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuanhui -d yuanhui"]
      interval: 5s
      timeout: 5s
      retries: 20
