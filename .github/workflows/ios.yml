name: ios
# 只在 ios/、contracts/（ShopCore 的测试读契约和向量）或本工作流改动时触发（偏差说明见 docs/process-deviations.md）。
# 没触发时 scripts/merge-pr.sh 把它当作「不需要」，不会卡合并。
on:
  pull_request:
    paths:
      - "ios/**"
      - "contracts/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "contracts/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  # 本机只有一台自托管 runner，排队跑，不并发
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-ci:
    name: ios-ci
    runs-on: [self-hosted, macOS, yuanhui]
    timeout-minutes: 75   # S22b：测试约 40 分钟 + Release、Beta 检查各约 6 分钟，45 分钟不够（D-S22b-1）
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: xcodegen
        run: xcodegen generate
      - name: 建本次专用模拟器
        id: sim
        run: |
          udid=$(scripts/sim-create.sh "yuanhui-ci-${{ github.run_id }}-${{ github.run_attempt }}")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "DERIVED=$RUNNER_TEMP/yuanhui-dd-${{ github.run_id }}" >> "$GITHUB_ENV"
      - name: 先启动模拟器（UI 测试和 Release 检查都在同一台上跑，启动好了再开始）
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b >/dev/null
      - name: xcodebuild test
        # 模拟器上本地签名（ad-hoc，不用证书和描述文件）：不签名的 App 写钥匙串会得到 -34018（errSecMissingEntitlement），
        # S21 登录后令牌进钥匙串，S21UITests 要靠它（§8 S21）
        # -collect-test-diagnostics never：测试全过后 xcodebuild 仍会跑 `simctl diagnose`，在这台 Mac 上每次卡满 600 秒超时，
        # 三次 xcodebuild 共多出约 30 分钟，把 75 分钟时限撑爆（D-1126-1）
        run: |
          set -o pipefail
          xcodebuild test \
            -project YuanhuiZhangben.xcodeproj \
            -scheme YuanhuiZhangben \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED" \
            -collect-test-diagnostics never \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: |Test Case|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log"
      - name: Release 构建检查（没有演示会话和会话夹具，§14 S15-4）
        run: |
          scripts/release-check.sh "${{ steps.sim.outputs.udid }}" "$RUNNER_TEMP/yuanhui-dd-rel-${{ github.run_id }}" \
            "$DERIVED/Build/Products/Debug-iphonesimulator/YuanhuiZhangben.app/YuanhuiZhangben.debug.dylib"
      - name: Beta 构建检查（同一套检查跑 Beta 配置，二进制里应有 IP 回退地址，§8 S21）
        run: |
          scripts/release-check.sh --config Beta "${{ steps.sim.outputs.udid }}" "$RUNNER_TEMP/yuanhui-dd-beta-${{ github.run_id }}" \
            "$DERIVED/Build/Products/Debug-iphonesimulator/YuanhuiZhangben.app/YuanhuiZhangben.debug.dylib"
      - name: 清理自己建的模拟器
        if: always()
        run: |
          scripts/sim-destroy.sh "${{ steps.sim.outputs.udid }}"
          [ -n "${DERIVED:-}" ] && rm -rf "$DERIVED" || true
          rm -rf "$RUNNER_TEMP/yuanhui-dd-rel-${{ github.run_id }}" "$RUNNER_TEMP/yuanhui-dd-beta-${{ github.run_id }}"
