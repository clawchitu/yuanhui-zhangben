# 构建生产镜像（linux/amd64，S08 sharp 要求 1–3），合并到 main 后推 ACR（§8 S10a 产出「构建并推 ACR」，§14 S10a-8 保留推送步骤）。
# 推送要仓库 secrets ACR_REGISTRY（ACR 的公网地址，不是 ECS 拉取用的 VPC 地址）/ ACR_USERNAME / ACR_PASSWORD；
# 没配之前推送步骤自动跳过，PR 上只构建、不推送。
# 不用 ACR 的发布（负责人 11/22 决定，默认做法）：main 的 push、手动触发、或带 deploy-tar 标签的 PR，
# 把 api 和两个基础镜像 docker save 成 yuanhui-images-<提交号>.tar.gz 传成 artifact（留 3 天）。
# 本机 gh run download 取下 → IMAGES_TAR=… deploy/deploy.sh <提交号>（runbook「首次部署」）。
name: image
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 构建 linux/amd64 镜像（标签 = 提交号）
        run: docker build --platform linux/amd64 -f server/Dockerfile -t "yuanhui-api:${GITHUB_SHA}" .
      - name: 检查架构与 sharp 预编译包（不许是 arm64、不许缺 @img/sharp-linux-x64）
        run: |
          test "$(docker image inspect -f '{{.Architecture}}' "yuanhui-api:${GITHUB_SHA}")" = amd64
          docker run --rm "yuanhui-api:${GITHUB_SHA}" sh -c 'ls node_modules/@img/ | grep -qx sharp-linux-x64 && ls node_modules/@img/ | grep -qx sharp-libvips-linux-x64'
          docker run --rm "yuanhui-api:${GITHUB_SHA}" node scripts/smoke-image.ts
      - name: 推 ACR（只在 main，且配了 ACR 凭据时）
        if: github.event_name == 'push' && env.ACR_REGISTRY != ''
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
          docker tag "yuanhui-api:${GITHUB_SHA}" "$ACR_REGISTRY/yuanhui/api:${GITHUB_SHA}"
          docker push "$ACR_REGISTRY/yuanhui/api:${GITHUB_SHA}"
      - name: 打包镜像 tar（api + caddy + postgres，linux/amd64）
        id: tar
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'deploy-tar')
        env:
          # PR 上 GITHUB_SHA 是合并提交，标签用分支头的提交号（deploy.sh 填的就是它）
          TAG: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker pull --platform linux/amd64 caddy:2.10.2
          docker pull --platform linux/amd64 postgres:16
          docker tag "yuanhui-api:${GITHUB_SHA}" "local/yuanhui/api:${TAG}"
          docker tag caddy:2.10.2 local/yuanhui/caddy:2.10.2
          docker tag postgres:16 local/yuanhui/postgres:16
          for i in caddy:2.10.2 postgres:16; do test "$(docker image inspect -f '{{.Architecture}}' "local/yuanhui/$i")" = amd64; done
          docker save "local/yuanhui/api:${TAG}" local/yuanhui/caddy:2.10.2 local/yuanhui/postgres:16 | gzip -1 > "yuanhui-images-${TAG}.tar.gz"
          sha256sum "yuanhui-images-${TAG}.tar.gz" | tee "yuanhui-images-${TAG}.tar.gz.sha256"
          ls -l "yuanhui-images-${TAG}.tar.gz"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: 上传镜像 tar（artifact）
        if: steps.tar.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: yuanhui-images-${{ steps.tar.outputs.tag }}
          path: yuanhui-images-${{ steps.tar.outputs.tag }}.tar.gz*
          retention-days: 3
          compression-level: 0
