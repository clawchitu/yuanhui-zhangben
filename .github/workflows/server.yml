name: server
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server-ci:
    name: server-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yuanhui
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: yuanhui_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yuanhui"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://yuanhui:ci-only-not-secret@localhost:5432/yuanhui_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: 校验 contracts（openapi、JSON Schema 语法，向量文件格式）
        run: npm run contracts:check
      - run: npm test
      - name: 构建镜像（server/Dockerfile）
        working-directory: .
        run: docker build -f server/Dockerfile -t yuanhui-api:ci .
      - name: 镜像冒烟：镜像里真缩一张图（sharp / libvips 编解码器，S08 要求 5）
        working-directory: .
        run: docker run --rm yuanhui-api:ci node scripts/smoke-image.ts
      - name: 部署脚本语法检查（bash -n、shellcheck）、单元测试（模拟 ssh / docker）、Caddyfile 校验、compose 配置解析
        working-directory: .
        run: |
          for f in deploy/*.sh deploy/test/*.sh deploy/test/fakes/*; do bash -n "$f"; done
          shellcheck -S warning deploy/*.sh deploy/test/*.sh deploy/test/fakes/*
          bash deploy/test/deploy.test.sh
          # 同一套测试再跑一遍，替身 docker 每次 compose 调用都先让真 Compose 对同样的文件和环境做一次插值（config -q）
          printf '#!/bin/sh\nexec /usr/bin/docker compose "$@"\n' > /tmp/real-compose && chmod +x /tmp/real-compose
          FAKE_REAL_COMPOSE=/tmp/real-compose bash deploy/test/deploy.test.sh
          bash deploy/test/bootstrap.test.sh
          bash deploy/test/smoke.test.sh
          # S10b：backup.sh / restore.sh 跑真脚本（替身 docker 转给本机 node、pg_dump），连 CI 的 Postgres 服务
          pg_dump --version
          bash deploy/test/backup.test.sh
          # 备份定时器的时间表（§9.4：8:00–22:00 每小时、02:30，上海时间）语法和下一次触发时间
          systemd-analyze calendar --iterations=3 '*-*-* 08..22:00:00 Asia/Shanghai' '*-*-* 02:30:00 Asia/Shanghai'
          grep -Fxq 'OnCalendar=*-*-* 08..22:00:00 Asia/Shanghai' deploy/yuanhui-backup.timer
          grep -Fxq 'OnCalendar=*-*-* 02:30:00 Asia/Shanghai' deploy/yuanhui-backup.timer
          cp deploy/.env.example /tmp/ci.env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=0123456789abcdef0123/; s/^ACME_EMAIL=$/ACME_EMAIL=ci@example.invalid/; s/^API_IMAGE=$/API_IMAGE=yuanhui-api:ci/; s#^CADDY_IMAGE=$#CADDY_IMAGE=registry.invalid/yuanhui/caddy:2.10.2#; s#^POSTGRES_IMAGE=$#POSTGRES_IMAGE=registry.invalid/yuanhui/postgres:16#' /tmp/ci.env
          docker compose -f deploy/compose.yml --env-file /tmp/ci.env config -q
          # 首次发布：.env 的 API_IMAGE 按 .env.example 留空。真 Compose 不带新镜像必须报错（替身 docker 照此行为），
          # 带上 remote-deploy.sh 的写法 API_IMAGE=<新镜像> 必须通过，config 和只起 postgres 都一样（PR #22 第二轮）
          sed 's/^API_IMAGE=.*/API_IMAGE=/' /tmp/ci.env > /tmp/ci-first.env
          if docker compose -f deploy/compose.yml --env-file /tmp/ci-first.env config -q 2>/dev/null; then echo "API_IMAGE 为空也能过" >&2; exit 1; fi
          if docker compose -f deploy/compose.yml --env-file /tmp/ci-first.env config -q postgres 2>/dev/null; then echo "只看 postgres 时 API_IMAGE 为空也能过" >&2; exit 1; fi
          API_IMAGE=registry.invalid/yuanhui/api:0123456789abcdef0123456789abcdef01234567 docker compose -f deploy/compose.yml --env-file /tmp/ci-first.env config -q
          # 已有部署：.env 里是上一个镜像，shell 环境变量盖过 .env（脚本只在切换前临时带，回滚时不带）
          API_IMAGE=registry.invalid/yuanhui/api:new docker compose -f deploy/compose.yml --env-file /tmp/ci.env config --format json | jq -e '.services.api.image == "registry.invalid/yuanhui/api:new"'
          # 三个镜像变量不填必须报错（不许回落到 Docker Hub）
          for v in CADDY_IMAGE POSTGRES_IMAGE; do
            grep -v "^$v=" /tmp/ci.env > /tmp/ci-missing.env
            if docker compose -f deploy/compose.yml --env-file /tmp/ci-missing.env config -q 2>/dev/null; then echo "$v 没填也能过" >&2; exit 1; fi
          done
          # api 内存上限不许靠 swap 顶（S10a-7）；不开 443/udp（S10a-5）；三个服务都有日志轮转
          docker compose -f deploy/compose.yml --env-file /tmp/ci.env config --format json > /tmp/compose.json
          jq -e '.services.api.mem_limit == "536870912" and .services.api.memswap_limit == "536870912"' /tmp/compose.json
          jq -e '[.services.caddy.ports[] | select(.protocol == "udp")] | length == 0' /tmp/compose.json
          jq -e '[.services[] | .logging.options["max-size"]] | all' /tmp/compose.json
          jq -e '.networks.db.internal == true' /tmp/compose.json
          # 备份凭据和口令只给 backup 服务，api 容器拿不到（§14 T21）
          docker compose -f deploy/compose.yml --env-file /tmp/ci.env --profile tools config --format json > /tmp/compose-tools.json
          jq -e '(.services.api.environment | keys | map(select(startswith("BACKUP_"))) | length) == 0' /tmp/compose-tools.json
          jq -e '.services.backup.environment | has("BACKUP_PASSPHRASE") and has("BACKUP_OSS_ACCESS_KEY_ID")' /tmp/compose-tools.json
          # backup 服务内存上限也不许靠 swap 顶（S10b-8）；恢复模式默认关、确实传给了 api（PR #23 Codex 4、Fable 必须改 2、7）
          jq -e '.services.backup.mem_limit == "268435456" and .services.backup.memswap_limit == "268435456"' /tmp/compose-tools.json
          jq -e '.services.api.environment.RECOVERY_MODE == "0"' /tmp/compose.json
          RECOVERY_MODE=1 docker compose -f deploy/compose.yml --env-file /tmp/ci.env config --format json | jq -e '.services.api.environment.RECOVERY_MODE == "1"'
          docker run --rm -v "$PWD/deploy:/etc/caddy:ro" -e ACME_EMAIL=ci@example.invalid -e PUBLIC_IP=47.117.184.253 caddy:2.10.2 caddy validate --config /etc/caddy/Caddyfile.ip --adapter caddyfile
      - name: 镜像冒烟：迁移 → 启动 → /healthz 200 → 停库后 503
        working-directory: .
        run: |
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" yuanhui-api:ci node scripts/migrate.ts
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" yuanhui-api:ci node scripts/migrate.ts | grep -q "没有新的迁移"
          docker run -d --name api --network host -e DATABASE_URL="$DATABASE_URL" -e PORT=3999 yuanhui-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3999/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/healthz)" = 200
          curl -fsS http://127.0.0.1:3999/v1/config
          docker stop "$(docker ps -q --filter ancestor=postgres:16)"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:3999/healthz)
          echo "停库后 /healthz → $code"
          test "$code" = 503
          docker rm -f api
