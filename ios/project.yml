name: YuanhuiZhangben
options:
  bundleIdPrefix: cn.yuanhuishop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ShopCore:
    path: ShopCore
configs:
  Debug: debug
  Beta: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: C29GS8XSA6
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  YuanhuiZhangben:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ShopCore
    configFiles:
      Debug: Config/Debug.xcconfig
      Beta: Config/Beta.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.yuanhuishop.zhangben
        PRODUCT_NAME: YuanhuiZhangben
        INFOPLIST_KEY_CFBundleDisplayName: 元辉账本
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  YuanhuiZhangbenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: YuanhuiZhangben
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.yuanhuishop.zhangben.tests
        GENERATE_INFOPLIST_FILE: YES
  YuanhuiZhangbenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: YuanhuiZhangben
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.yuanhuishop.zhangben.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: YuanhuiZhangben
schemes:
  YuanhuiZhangben:
    build:
      targets:
        YuanhuiZhangben: all
        YuanhuiZhangbenTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YuanhuiZhangbenTests
        - YuanhuiZhangbenUITests
        - package: ShopCore/ShopCoreTests
    archive:
      config: Release
  # 只给 scripts/release-check.sh 用：Release 配置构建 App，只跑 ReleaseBuildUITests（§14 S15-4）
  YuanhuiZhangben-ReleaseCheck:
    build:
      targets:
        YuanhuiZhangben: all
        YuanhuiZhangbenUITests: [test]
    test:
      config: Release
      environmentVariables:
        YH_RELEASE_CHECK: "1"
      targets:
        - YuanhuiZhangbenUITests
  YuanhuiZhangben-Beta:
    build:
      targets:
        YuanhuiZhangben: all
    run:
      config: Beta
    archive:
      config: Beta
